
<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <title>Andamento COVID-19 Italia</title>
    <style>
        table {
            border-collapse: collapse;
            width: 100%;
            font-size: 12px;
        }
        th, td {
            border: 1px solid #ccc;
            padding: 6px;
            text-align: center;
        }
        th {
            background-color: #ddd;
        }
        tr:nth-child(even) {
            background-color: #f2f2f2;
        }
        .table-container {
            overflow-x: auto;
        }
    </style>
</head>
<body>

<h2>Andamento nazionale COVID-19</h2>

<div class="table-container">
    <table id="tabella"></table>
</div>

<script>
const url = "https://raw.githubusercontent.com/pcm-dpc/COVID-19/master/dati-json/dpc-covid19-ita-andamento-nazionale.json";

fetch(url)
    .then(response => response.json())
    .then(data => {

        const tabella = document.getElementById("tabella");

        const chiavi = Object.keys(data[0]);

        const thead = document.createElement("thead");
        const rigaIntestazione = document.createElement("tr");

        chiavi.forEach(chiave => {
            const th = document.createElement("th");
            th.textContent = chiave;
            rigaIntestazione.appendChild(th);
        });

        thead.appendChild(rigaIntestazione);
        tabella.appendChild(thead);

        const tbody = document.createElement("tbody");

        data.forEach(record => {
            const tr = document.createElement("tr");

            chiavi.forEach(chiave => {
                const td = document.createElement("td");
                td.textContent = record[chiave] ?? "";
                tr.appendChild(td);
            });

            tbody.appendChild(tr);
        });

        tabella.appendChild(tbody);

    })
    .catch(error => {
        console.error("Errore nel caricamento JSON:", error);
    });
</script>

</body>
</html>
