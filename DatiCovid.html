
<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html PUBLIC
 "-//W3C//DTD XHTML 1.0 Strict//EN"
 "http://www.w3.org/TR/xhtml1/DTD/xhtml1-strict.dtd">

<html xmlns="http://www.w3.org/1999/xhtml" lang="it" xml:lang="it">
<head>
    <meta http-equiv="Content-Type"
          content="application/xhtml+xml; charset=UTF-8" />

    <title>Andamento COVID-19 Italia</title>

    <style type="text/css">
        table {
            border-collapse: collapse;
            width: 100%;
            font-size: 12px;
        }

        th, td {
            border: 1px solid #ccc;
            padding: 6px;
            text-align: center;
        }

        th {
            background-color: #ddd;
        }

        tr:nth-child(even) {
            background-color: #f2f2f2;
        }

        .table-container {
            overflow-x: auto;
        }
    </style>
</head>

<body>

    <h2>Andamento nazionale COVID-19</h2>

    <div class="table-container">
        <table id="tabella">
            <thead>
                <tr id="intestazione"></tr>
            </thead>
            <tbody id="corpo-tabella"></tbody>
        </table>
    </div>

    <script type="text/javascript">
    

    var url = "https://raw.githubusercontent.com/pcm-dpc/COVID-19/master/dati-json/dpc-covid19-ita-andamento-nazionale.json";

    var richiesta = new XMLHttpRequest();

    richiesta.open("GET", url, true);

    richiesta.onreadystatechange = function () {

        if (richiesta.readyState === 4) {

            if (richiesta.status === 200) {

                var data = JSON.parse(richiesta.responseText);

                var intestazione =
                    document.getElementById("intestazione");

                var corpo =
                    document.getElementById("corpo-tabella");

                if (data.length > 0) {

                    var chiavi = Object.keys(data[0]);

                    chiavi.forEach(function (chiave) {

                        var th = document.createElement("th");

                        th.appendChild(
                            document.createTextNode(chiave)
                        );

                        intestazione.appendChild(th);

                    });

                    data.forEach(function (record) {

                        var tr = document.createElement("tr");

                        chiavi.forEach(function (chiave) {

                            var td = document.createElement("td");

                            var valore = record[chiave];

                            td.appendChild(
                                document.createTextNode(
                                    valore === null ||
                                    valore === undefined
                                    ? ""
                                    : valore
                                )
                            );

                            tr.appendChild(td);

                        });

                        corpo.appendChild(tr);

                    });

                }

            } else {

                console.error(
                    "Errore HTTP: " + richiesta.status
                );

            }

        }

    };

    richiesta.onerror = function () {
        console.error("Errore nella richiesta HTTP.");
    };

    richiesta.send();

    //]]>

    </script>

</body>
</html>
